name: CI

# PRs already run as pull_request. Branch pushes without a PR are not a
# merge gate. Running both push and pull_request on the same SHA doubled
# runner minutes (observed: ~26s + ~27s on the same commit) without extra
# correctness.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Cheap correctness first so a schema/unit failure does not pay for a build.
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Accessibility checklist artifact exists
        run: test -f dist/client/api/a11y-checklist.json || test -f dist/api/a11y-checklist.json
